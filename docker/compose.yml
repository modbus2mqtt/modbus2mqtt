services:
  modbus2mqtt:
    # Use locally built image tag from docker/build.sh
    image: modbus2mqtt:latest
    container_name: modbus2mqtt
    ports:
      - 3000:3000
      - 3443:3443
    restart: always
    volumes:
      # ONE volume: ALL configuration (MQTT/busses/devices/specs/secrets)
      # and the public specifications live under /data - mounting this is
      # enough for the whole setup to survive container recreation.
      - data:/data
      # Optional: TLS certificates (fullchain.pem, privkey.pem, secrets.txt)
      - ssl:/ssl
    environment:
      - TZ=Europe/Berlin
      - MODBUS2MQTT_HTTPS_PORT=3443
volumes:
  data:
  ssl:
